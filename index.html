<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>water-for-father-2026</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <iframe
        id="design-frame"
        class="design-frame"
        title="water-for-father-2026 design viewer"
        src="./designs/metallic/index.html"
        loading="eager"
        allow="fullscreen"
      ></iframe>

      <nav class="design-switcher" aria-label="Design switcher">
        <button
          class="design-tab is-active"
          type="button"
          data-design="metallic"
        >
          Metal Slide
        </button>
        <button class="design-tab" type="button" data-design="neo-tokyo">
          City Lights
        </button>
        <button class="design-tab" type="button" data-design="morfh">
          MORFH
        </button>
      </nav>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
